name: Build Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps and ldid
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld lldb build-essential fakeroot libssl-dev libcurl4-openssl-dev libxml2-dev libncurses5-dev libpng-dev git make xz-utils libplist-dev wget
          wget https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -O ldid
          chmod +x ldid
          sudo mv ldid /usr/local/bin/ldid

      - name: Setup Theos and iOS SDK
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks
          mkdir -p $THEOS/sdks
          mv $HOME/sdks/iPhoneOS*.sdk $THEOS/sdks/
          rm -rf $HOME/sdks

      - name: Build
        run: |
          mkdir -p $THEOS/toolchain/linux/iphone/bin
          ln -sf $(which clang) $THEOS/toolchain/linux/iphone/bin/clang
          ln -sf $(which clang++) $THEOS/toolchain/linux/iphone/bin/clang++
          ln -sf $(which ld64.lld) $THEOS/toolchain/linux/iphone/bin/ld64
          ln -sf $(which ld64.lld) $THEOS/toolchain/linux/iphone/bin/ld
          
          # 核心修复：把自建的 toolchain 路径放到 PATH 最前面，这样 Clang 找 ld 时直接命中我们自己的 ld64.lld
          export PATH=$THEOS/toolchain/linux/iphone/bin:$PATH
          
          make clean || true
          # 移除了会报错的 -fuse-ld 参数
          make package TARGET=iphone:clang:latest:14.0 FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: packages/*.deb
