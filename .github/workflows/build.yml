name: Build Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps and ldid
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lldb build-essential fakeroot libssl-dev libcurl4-openssl-dev libxml2-dev libncurses5-dev libpng-dev git make xz-utils libplist-dev wget
          wget https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -O ldid
          chmod +x ldid
          sudo mv ldid /usr/local/bin/ldid

      - name: Setup Theos and iOS SDK
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks
          mkdir -p $THEOS/sdks
          mv $HOME/sdks/iPhoneOS*.sdk $THEOS/sdks/
          rm -rf $HOME/sdks

      - name: Build
        run: |
          # 核心魔法：把系统的 clang 软链接到 Theos 期望的路径下
          mkdir -p $THEOS/toolchain/linux/iphone/bin
          ln -sf $(which clang) $THEOS/toolchain/linux/iphone/bin/clang
          ln -sf $(which clang++) $THEOS/toolchain/linux/iphone/bin/clang++
          
          # 显式指定编译目标（iOS 14.0），避免 Theos 找不到默认目标
          make clean || true
          make package TARGET=iphone:clang:latest:14.0 FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: packages/*.deb
