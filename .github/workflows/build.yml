name: Build Tweak
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz

      - name: Setup Theos and iOS SDK
        run: |
          export THEOS=$HOME/theos
          # 克隆 roothide 版本的 Theos
          git clone --recursive --depth 1 https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          
          # 下载并放置 iOS SDK
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks
          mkdir -p $THEOS/sdks
          mv $HOME/sdks/iPhoneOS*.sdk $THEOS/sdks/
          rm -rf $HOME/sdks

      - name: Build Package
        run: |
          make clean || true
          # 强制指定目标架构，防止个别头文件报错
          make package TARGET=iphone:clang:latest:14.0 FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: packages/*.deb
